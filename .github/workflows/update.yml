name: update-and-deploy
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths-ignore: ["data/**", "web/public/news.json"]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: news, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt && pytest -q && python fetch.py
      - name: Commit data
        run: |
          git config user.name "news-bot" && git config user.email "bot@users.noreply.github.com"
          git add data web/public/news.json
          git diff --staged --quiet || (git commit -m "data: update" && git push)
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd web && npm install && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
      - id: d
        uses: actions/deploy-pages@v4
